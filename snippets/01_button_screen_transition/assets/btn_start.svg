<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <!-- ドロップシャドウ -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- ボタン本体グラデーション（オレンジ/ゴールド） -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- ボタン上面ハイライト -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- ボタン下部（立体的な厚み・影） -->
  <rect x="10" y="16" width="300" height="68" rx="34" fill="#92400e" filter="url(#btnShadow)"/>

  <!-- ボタン本体 -->
  <rect x="10" y="8" width="300" height="68" rx="34" fill="url(#btnGrad)" stroke="#fef08a" stroke-width="3"/>

  <!-- 上半分ハイライト -->
  <path d="M 44 11 Q 160 14 276 11 Q 290 20 286 34 Q 160 38 34 34 Q 30 20 44 11 Z" fill="url(#highlight)"/>

  <!-- アイコン (再生三角) -->
  <polygon points="100,28 100,56 126,42" fill="#78350f"/>
  <polygon points="98,26 98,54 124,40" fill="#ffffff"/>

  <!-- テキスト -->
  <text x="195" y="49" text-anchor="middle" font-family="'Segoe UI', 'Hiragino Sans', sans-serif" font-size="28" font-weight="900" fill="#78350f" letter-spacing="3">
    START
  </text>
  <text x="194" y="47" text-anchor="middle" font-family="'Segoe UI', 'Hiragino Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3">
    START
  </text>
</svg>
