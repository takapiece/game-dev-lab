<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- 背景ベース -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- デコレーション円 / グリッド -->
  <circle cx="640" cy="220" r="280" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>
  <circle cx="640" cy="220" r="180" stroke="rgba(99,102,241,0.15)" stroke-width="1.5" stroke-dasharray="8 8" fill="none"/>

  <!-- タイトル文字風デコレーション -->
  <text x="640" y="200" text-anchor="middle" font-family="'Segoe UI', 'Hiragino Sans', sans-serif" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="4">
    MY AWESOME GAME
  </text>
  <text x="640" y="245" text-anchor="middle" font-family="'Segoe UI', 'Hiragino Sans', sans-serif" font-size="20" font-weight="600" fill="#818cf8" letter-spacing="8">
    — TITLE SCREEN —
  </text>

  <!-- 下部ガイド -->
  <text x="640" y="680" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">
    ※ これは assets/bg_title.svg です（お好みの画像に差し替え可能）
  </text>
</svg>
