<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <filter id="backShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="backHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- ボタン下部（影） -->
  <rect x="8" y="14" width="264" height="60" rx="30" fill="#075985" filter="url(#backShadow)"/>

  <!-- ボタン本体 -->
  <rect x="8" y="6" width="264" height="60" rx="30" fill="url(#backGrad)" stroke="#bae6fd" stroke-width="2.5"/>

  <!-- ハイライト -->
  <path d="M 38 9 Q 140 12 242 9 Q 254 17 250 28 Q 140 32 30 28 Q 26 17 38 9 Z" fill="url(#backHighlight)"/>

  <!-- アイコン (戻る矢印) -->
  <path d="M 92 36 L 108 24 L 108 48 Z" fill="#0c4a6e"/>
  <path d="M 90 35 L 106 23 L 106 47 Z" fill="#ffffff"/>

  <!-- テキスト -->
  <text x="175" y="44" text-anchor="middle" font-family="'Segoe UI', 'Hiragino Sans', sans-serif" font-size="22" font-weight="900" fill="#0c4a6e" letter-spacing="2">
    タイトルへ戻る
  </text>
  <text x="174" y="43" text-anchor="middle" font-family="'Segoe UI', 'Hiragino Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2">
    タイトルへ戻る
  </text>
</svg>
